# this is distinct from the installation so that static and dynamic
# builds can be installed into the same directory and all of them are
# cleaned up here.
.clean_tpl_installs:
  extends: .build_base
  stage: cleanTPLInstalls
  variables:
    # no need to clone repo
    GIT_STRATEGY: none
  script:
    - cleanInstallDir "${admsInstallDir}/${optStr}"
    - cleanInstallDir "${ssInstallDir}/${optStr}/${libTypeStr}"
    - cleanInstallDir "${trilinosInstallDir}/${optStr}/${libTypeStr}"
    - cleanInstallDir "${adiakInstallDir}/${optStr}/${libTypeStr}"
    - cleanInstallDir "${adcInstallDir}/${optStr}/${libTypeStr}"
  rules:
    # always do cleanup if TPLs are building
    - if: '$DO_TPL_BUILDS == "true" && $CI_PIPELINE_SOURCE == "trigger"'

GNU_serial.cleanup:
  extends:
    - .clean_tpl_installs
    - .gnu_serial_vars
  parallel:
    matrix:
      - buildShared: ["ON", "OFF"]
        cmakeBuildType: ["Debug", "Release"]

GNU_OpenMPI.cleanup:
  extends:
    - .clean_tpl_installs
    - .gnu_openmpi_vars
  parallel:
    matrix:
      - buildShared: ["ON", "OFF"]
