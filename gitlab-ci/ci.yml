# General notes:
#
#   *) While you can, in theory, override any of the variables below via
#      the "Run Pipeline" UI or in the curl command, in practice you
#      should try to only modify the variables in all caps.
spec:
  inputs:
    doTriggerAudit:
      description: "Causes a log of variables every time the pipeline is triggered for any reason"
      type: boolean
      default: true
    baseInstallDir:
      description: "Base installation directory for deployment"
      type: string
      default: /projects/xyce_user/install
    doTPLBuilds:
      description: "Build relevant TPLs, including trilinos"
      type: boolean
      default: false
    doXyceBuilds:
      description: "Build Xyce"
      type: boolean
      default: true
    doModuleGeneration:
      description: "Generate TCL/LUA modules for relevant platforms"
      type: boolean
      default: true
    doFinalize:
      description: "Set permissions and finalize installations"
      type: boolean
      default: true
    doTestModules:
      description: "Test modules on relevant platforms"
      type: boolean
      default: true
    doAnalysisBuildTest:
      description: "Do various analysis builds, like GNU ASAN"
      type: boolean
      default: false
    xyceInstallString:
      description: "Identifying string used on the dashboard and installation directories"
      type: string
      default: "develop"
    defaultBranch:
      description: "Default branch for all repos"
      type: string
      default: "develop"
    XyceBranch:
      description: "The Xyce branch to use for the build"
      type: string
      default: ""
    XyceNonFreeBranch:
      description: "The Xyce_NonFree branch to use for the build"
      type: string
      default: ""
    XyceSandiaModelsBranch:
      description: "The Xyce_SandiaModels branch to use for the build"
      type: string
      default: ""
    XyceFTRegressionBranch:
      description: "The Xyce_FastrackRegression branch to use for the build"
      type: string
      default: ""
    XyceRegressionBranch:
      description: "The Xyce_Regression branch to use for the build"
      type: string
      default: ""
    XyceSandiaRegressionBranch:
      description: "The Xyce_SandiaRegression branch to use for the build"
      type: string
      default: ""
    trilinosVersion:
      description: "The trilinos version to build. Can be a SHA1, branch or tag."
      type: string
      default: "trilinos-release-16-2-1"
    gitlabCITrace:
      description: "gitlab CI tracing"
      type: boolean
      default: false
    HPCRootFilesystem:
      description: "The root file system to use for CI builds on HPC."
      type: string
      default: "rlfs01"
      options:
        - "rlfs01"
        - "rnfs01"
        - "tscratch"
        - "pscratch"
    CEERootFilesystem:
      description: "The root file system to use for CI buids on CEE."
      type: string
      default: "scratch"
      options:
        - "scratch"
        - "fgs"

---
include:
  - gitlab-ci/buildBase.yml
  - gitlab-ci/cleanTPLInstalls.yml
  - gitlab-ci/buildTPLs.yml
  - gitlab-ci/buildTestInstallXyce.yml
  - gitlab-ci/generateModules.yml
  - gitlab-ci/finalize.yml
  - gitlab-ci/testModules.yml
  - gitlab-ci/analysisBuilds.yml

stages:
  - triggerAudit
  - triggerAsEntity
  - cleanTPLInstalls
  - buildTPLs
  - buildTestInstallXyce
  - generateModules
  - finalize
  - testModules
  - analysisBuildTest

variables:
  XYCE_NO_TRACKING: "TRUE"

  ADCT_VERSION: "v1.0.0"
  ADIAK_VERSION: "v0.4.1"
  SUITESPARSE_VERSION: "v7.8.3"
  ADMS_VERSION: "release-2.3.7.XYCE"

  BASE_INSTALL_DIR: $[[ inputs.baseInstallDir ]]
  BaseModuleInstallDir: ${BASE_INSTALL_DIR}/modules

  # XYCE_INSTALL_STRING appears in the installation subdirectory name and on
  # the dashboard. This allows you to do something like set it to
  # "stable" and have xyceBranch point to something like "master"
  XYCE_INSTALL_STRING: "$[[ inputs.xyceInstallString ]]"

  # this list is used to dynamically create the names of the variables
  # that will store the actual branch names by appending "Branch" to
  # them. should be one for each Xyce repo.
  BranchList: "Xyce XyceFTRegression XyceRegression XyceNonFree XyceSandiaModels XyceSandiaRegression"

  # xyce repo. for debugging in your own fork change this. 
  mainXyceRepo: "Xyce/code/uur-proprietary/Xyce.git"
  ##mainXyceRepo: "gary-hennigan/xycefork/Xyce.git"

  # This helps a lot when debugging pipelines
  CI_DEBUG_TRACE: $[[ inputs.gitlabCITrace ]]

  HPC_ROOT_FILESYSTEM: "rlfs01"

  CommonModules: "
    aue/git
    aue/git-lfs
    aue/cmake
    aue/ninja
    aue/binutils
    "

  # clone the full repo, including branches and tags, for more
  # flexibility when specifying the versions. this is a built-in
  # variable and shouldn't be modified
  GIT_DEPTH: 0

  # what filesystem to use on HPC
  HPC_ROOT_FILESYSTEM: "$[[ inputs.HPCRootFilesystem ]]"
  CEE_ROOT_FILESYSTEM: "$[[ inputs.CEERootFilesystem ]]"

default:
  id_tokens:
    CI_JOB_JWT:
      aud: https://cee-gitlab.sandia.gov

# this is the stage that will trigger the rest of the pipeline stages,
# dependent on the value of the relevant "DO_*" booleans.
trigger_pipeline:
  stage: triggerAsEntity
  tags:
    - cee.build
  variables:
    # no need to clone repo
    GIT_STRATEGY: none
  needs: []
  script:
    - echo "CI_PROJECT_ID = ${CI_PROJECT_ID}"
    # XYCE_JENKINS_PIPELINE_TRIGGER_TOKEN is a variable
    # defined via the cee-gitlab UI and will be masked
    - |
      curl --request POST \
        --form token=${XYCE_JENKINS_PIPELINE_TRIGGER_TOKEN} \
        --form ref=${CI_COMMIT_BRANCH} \
        \
        --form "variables[DO_TPL_BUILDS]=$[[ inputs.doTPLBuilds ]]" \
        --form "variables[DO_XYCE_BUILDS]=$[[ inputs.doXyceBuilds ]]" \
        --form "variables[DO_MODULE_GENERATION]=$[[ inputs.doModuleGeneration ]]" \
        --form "variables[DO_FINALIZE]=$[[ inputs.doFinalize ]]" \
        --form "variables[DO_TEST_MODULES]=$[[ inputs.doTestModules ]]" \
        --form "variables[DO_XYCE_ANALYSIS_BUILDTEST]=$[[ inputs.doAnalysisBuildTest ]]" \
        \
        --form "variables[TRILINOS_VERSION]=$[[ inputs.trilinosVersion ]]" \
        \
        --form "variables[BASE_INSTALL_DIR]=$[[ inputs.baseInstallDir ]]" \
        --form "variables[DEFAULT_BRANCH]=$[[ inputs.defaultBranch ]]" \
        --form "variables[XYCE_INSTALL_STRING]=$[[ inputs.xyceInstallString ]]" \
        \
        --form "variables[XyceBranch]=$[[ inputs.XyceBranch ]]" \
        --form "variables[XyceFTRegressionBranch]=$[[ inputs.XyceFTRegressionBranch ]]" \
        --form "variables[XyceRegressionBranch]=$[[ inputs.XyceRegressionBranch ]]" \
        --form "variables[XyceNonFreeBranch]=$[[ inputs.XyceNonFreeBranch ]]" \
        --form "variables[XyceSandiaModelsBranch]=$[[ inputs.XyceSandiaModelsBranch ]]" \
        --form "variables[XyceSandiaRegressionBranch]=$[[ inputs.XyceSandiaRegressionBranch ]]" \
        \
        --form "variables[HPC_ROOT_FILESYSTEM]=$[[ inputs.HPCRootFilesystem ]]" \
        --form "variables[CEE_ROOT_FILESYSTEM]=$[[ inputs.CEERootFilesystem ]]" \
        --form "variables[CI_DEBUG_TRACE]=$[[ inputs.gitlabCITrace ]]" \
        \
        "https://cee-gitlab.sandia.gov/api/v4/projects/${CI_PROJECT_ID}/trigger/pipeline"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'

##############################################################
##############################################################
### audit template
.audit_template: &audit_template
  stage: triggerAudit
  artifacts:
    paths:
      - trigger-info.txt
    expire_in: 2 weeks
    when: always
  variables:
    GIT_STRATEGY: none
  script:
    # -----------------------------------------------------------------
    #  output some pipeline specific information
    # -----------------------------------------------------------------
    - |
      echo "   Pipeline triggered by: $CI_PIPELINE_SOURCE"
      echo "   Pipeline ID: $CI_PIPELINE_ID"
      echo "   Triggered by user: $GITLAB_USER_NAME <$GITLAB_USER_EMAIL>"
      echo "   Branch / Ref: $CI_COMMIT_REF_NAME"
    # -----------------------------------------------------------------
    #  output info to a file for archiving, trigger‑info.txt, and
    #  append the output of "env"
    # -----------------------------------------------------------------
    - |
      cat <<EOF > trigger-info.txt
      PIPELINE_SOURCE=$CI_PIPELINE_SOURCE
      PIPELINE_ID=$CI_PIPELINE_ID
      USER=$GITLAB_USER_NAME
      EMAIL=$GITLAB_USER_EMAIL
      REF=$CI_COMMIT_REF_NAME
      EOF

      echo "" >> trigger-info.txt
      echo "================= ENVIRONMENT =================" >> trigger-info.txt
      env >> trigger-info.txt

# log info about what is triggering the pipeline on the SRN
log_trigger_information:
  extends: .audit_template
  tags: [cee.build]
  rules:
    - if: '"$[[ inputs.doTriggerAudit ]]" == "true"'
